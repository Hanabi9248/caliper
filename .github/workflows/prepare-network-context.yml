name: Publish validated Caliper network context
on:
  push:
    branches: [codex/prepare-network-context]
    paths: [.github/workflows/prepare-network-context.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 78b9f4ea7d755221ef925be22219517d5795fa1e
      - name: Apply verified change
        env:
          PATCH_BASE64: 
        run: |
          set -eu
          test "$GITHUB_REPOSITORY" = Hanabi9248/caliper
          test -z "$(git ls-remote --heads origin refs/heads/codex/fabric-network-context)"
          printf '%s' "$PATCH_BASE64" | base64 --decode > /tmp/revision.diff
          git apply --index /tmp/revision.diff
          test "$(git write-tree)" = fe789737e8d840dc9558b0687e2b3f3d6823d1c5
          git -c user.name=Hanabi -c user.email=317387557+Hanabi9248@users.noreply.github.com commit -s -m 'Expose a network configuration snapshot to Fabric workloads'
          git push origin HEAD:refs/heads/codex/fabric-network-context
